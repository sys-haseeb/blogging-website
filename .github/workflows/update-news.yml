name: Update news

on:
  schedule:
    - cron: "*/15 * * * *"   # about every 15 minutes (GitHub may delay it)
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    paths:
      - scripts/fetch_news.py
      - .github/workflows/update-news.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the latest stories
        run: python scripts/fetch_news.py
      - name: Commit news.json if it changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/data/news.json
          git diff --cached --quiet || (git commit -m "Update news" && git push)
